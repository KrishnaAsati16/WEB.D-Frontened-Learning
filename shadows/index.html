 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHADOW -> BOX,TEXT</title>
    <style>
        .container {
            display: flex;
            justify-content: center;
            margin-top: 50px;
        } 

        .box {
            width: 350px;
            padding: 20px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.3);
        }

        .logo {
            width: 120px;
            margin-bottom: 10px;
        }

        h1 {
            text-shadow: 2px 2px 5px gray;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="box"> 

            <!-- Amazon Logo -->
            <img 
              src="https://upload.wikimedia.org/wikipedia/commons/a/a9/Amazon_logo.svg" 
              class="logo" 
              alt="Amazon Logo"
            >

            <h1>Welcome ji</h1>
