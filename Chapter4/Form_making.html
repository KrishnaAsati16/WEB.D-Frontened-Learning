<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>

<body>
    <h1>Forms In Html</h1>
    <form action="/submit.php">

        <div>
            <label for="name">Name :</label>
            <input id="name" placeholder="Enter Name" required>
        </div>
        <div>
            <label for="test">phone :</label>
            <input id="text" type="tel" placeholder="Enter Phone" required>
        </div>
        <div>
            <label for="email">Email :</label>
            <input id="email" type="email" placeholder="Enter email" required>
        </div>
        <div>
            <label for="password">password :</label>
            <input id="password" type="password" placeholder="Enter password" required>
        </div>
        <div>
            <label for="dob">date of birth :</label>
            <input id="dob" type="data" placeholder="Enter dob" required>
        </div>

        <!--Drowdown(selsect input) for gender -->
        <div>
            <label for="gender">Gender</label>
            <select id="gender" required>
                <option value="" disabled selected> Gender</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="other">Gay</option>
            </select>
        </div>
        <!-- Radio buttons for subscription plan-->
        <div>
            <p> subscription plan</p>
            <input id="basic" type="radio" name="subscription" value="basic">
            <label for="basic">Basic</label>

            <input id="premium" type="radio" name="subscription" value="premium">
            <label for="premium">Premium</label>

            <input id="vip" type="radio" name="subscription" value="vip">
            <label for="vip">Vip</label>
        </div>
           <!-- checkbox for agreeing to terms-->
            <div>
                <input id="terms" type="checkbox"  required>
                <label for="terms"> I agree to the terms condition</label>
            </div>
            <!-- texts For comments-->
             <div>
                <label for="comments"> Comments</label>
                <textarea id="Comments" placeholder=" Enter Yor Comments" rows="5"></textarea>
             </div>
             <!-- Sumbit button-->
              <div>
                <button type="submit"Submit></button>
              </div>
    </form>
</body>

</html>
