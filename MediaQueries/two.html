<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            border: 2px solid black;
            background-color: aqua;
            display: flex;
            flex-direction: row;
            width: 450px;
            padding: 2px;
            padding: 1px;
            display: flex;
        }
        .boxleft{
            background-color: aquamarine;
            border: 1px solid yellow;
            width:47%;
            margin: 3px;
            padding: 2px;
            flex-direction: column;
        }
        .boxright{
            background-color: beige;
            border: 1px solid yellow ;
            width: 47%;
             margin: 3px;
            padding: 2px;
        }
        p{
            border: 1px solid red;
        }
        img{
            width: 170px;
        }
        @media(max-width:640px){
            .container{
                flex-direction: column;
            }
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="boxleft">
            <p> text1</p>
            <p>text2</p>
        </div>
        <div class="boxright">
            <p><img src="3.jpg" alt=""></p>
        </div>
    </div>
</body>
</html>
